<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedidos — Vangust Burguer Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div id="header-placeholder"></div>

        <div class="page-body">
            <h1 class="page-title">Pedidos</h1>
            <p class="page-subtitle">Acompanhe e atualize o status em tempo real.</p>

            <div class="filtro-status" id="filtroStatus">
                <button data-status="" class="active">Todos</button>
                <button data-status="recebido">Recebido</button>
                <button data-status="em_preparo">Em preparo</button>
                <button data-status="saiu_entrega">Saiu p/ entrega</button>
                <button data-status="entregue">Entregue</button>
                <button data-status="cancelado">Cancelado</button>
            </div>

            <div class="card-box">
                <div class="table-wrap">
                    <table class="vg-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Cliente / Endereço</th>
                                <th>Itens & Observação</th>
                                <th>Valor</th>
                                <th>Status</th>
                                <th>Entregador</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyPedidos"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/pedidos.js"></script>
</body>
</html>
