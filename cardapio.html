<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cardápio — Vangust Burguer Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div id="header-placeholder"></div>

        <div class="page-body">
            <div class="card-header-row">
                <div>
                    <h1 class="page-title">Cardápio</h1>
                    <p class="page-subtitle">Gerencie os produtos exibidos no app do cliente.</p>
                </div>
                <button class="btn btn-primary" onclick="abrirModalNovo()"><i class="fa-solid fa-plus"></i> Novo produto</button>
            </div>

            <div class="card-box">
                <div class="table-wrap">
                    <table class="vg-table">
                        <thead>
                            <tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr>
                        </thead>
                        <tbody id="tbodyProdutos"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>
</div>

<!-- Modal Novo/Editar Produto -->
<div class="modal-overlay" id="modalProduto">
    <div class="modal-box">
        <h3 id="modalTitulo">Novo produto</h3>
        <form id="formProduto">
            <input type="hidden" id="f_id_produto">

            <div class="form-group">
                <label>Foto do Produto</label>
                <input type="file" id="f_imagem" accept="image/*">
            </div>

            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="f_nome" required>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="f_descricao" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Categoria</label>
                <input type="text" id="f_categoria" placeholder="Ex: Combos, Ofertas, Opções veganas" required>
            </div>
            <div class="form-group">
                <label>Preço (R$)</label>
                <input type="text" id="f_preco" placeholder="Ex: 29,90" required>
            </div>
            <div class="form-group">
                <label>Estoque</label>
                <input type="number" id="f_estoque" min="0" value="0" required>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/cardapio.js"></script>
</body>
</html>
