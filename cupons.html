<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cupons — Vangust Burguer Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div id="header-placeholder"></div>

        <div class="page-body">
            <div class="card-header-row">
                <div>
                    <h1 class="page-title">Cupons de Desconto</h1>
                    <p class="page-subtitle">Gerencie os cupons promocionais disponíveis para os clientes no app.</p>
                </div>
                <button class="btn btn-primary" onclick="abrirModalNovo()"><i class="fa-solid fa-plus"></i> Novo cupom</button>
            </div>

            <div class="card-box">
                <div class="table-wrap">
                    <table class="vg-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Descrição</th>
                                <th>Desconto</th>
                                <th>Validade</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tbodyCupons"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>
</div>

<!-- Modal Novo/Editar Cupom -->
<div class="modal-overlay" id="modalCupom">
    <div class="modal-box">
        <h3 id="modalTitulo">Novo cupom</h3>
        <form id="formCupom">
            <input type="hidden" id="f_id_cupom">

            <div class="form-group">
                <label>Código do Cupom (Ex: VANGUST10)</label>
                <input type="text" id="f_codigo" style="text-transform: uppercase;" required>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="f_descricao" placeholder="Ex: 10% de desconto em todo o cardápio" required>
            </div>
            <div class="form-group">
                <label>Valor do Desconto (0.10 para 10% ou 10.00 para R$ 10)</label>
                <input type="number" step="0.01" id="f_valor" placeholder="Ex: 0.10" required>
            </div>
            <div class="form-group">
                <label>Data de Validade</label>
                <input type="date" id="f_validade" required>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="f_status" class="form-control" style="padding:10px; width:100%;">
                    <option value="1">Ativo</option>
                    <option value="0">Inativo</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/cupons.js"></script>
</body>
</html>
