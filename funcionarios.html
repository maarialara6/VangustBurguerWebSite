<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Funcionários — Vangust Burguer Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div id="header-placeholder"></div>

        <div class="page-body">
            <div class="card-header-row">
                <div>
                    <h1 class="page-title">Funcionários</h1>
                    <p class="page-subtitle">Gerencie quem tem acesso ao painel administrativo por e-mail.</p>
                </div>
                <button class="btn btn-primary" onclick="abrirModalNovo()"><i class="fa-solid fa-user-plus"></i> Adicionar funcionário</button>
            </div>

            <div class="card-box">
                <div class="table-wrap">
                    <table class="vg-table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Cargo</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyFuncionarios"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>
</div>

<div class="modal-overlay" id="modalFuncionario">
    <div class="modal-box">
        <h3>Adicionar Funcionário</h3>
        <form id="formFuncionario">
            <div class="form-group">
                <label>E-mail do Utilizador</label>
                <input type="email" id="f_email" placeholder="email@exemplo.com" required>
                <small style="color:var(--vg-text-light); font-size:11px;">Se já tiver conta no app, será promovido a funcionário automaticamente.</small>
            </div>
            <div class="form-group">
                <label>Nome (caso seja novo cadastro)</label>
                <input type="text" id="f_nome" placeholder="Nome completo">
            </div>
            <div class="form-group">
                <label>Cargo</label>
                <select id="f_cargo" class="form-control" style="padding:10px; width:100%;">
                    <option value="Administrador">Administrador</option>
                    <option value="Atendente">Atendente</option>
                    <option value="Gerente">Gerente</option>
                </select>
            </div>
            <div class="form-group">
                <label>Senha Temporária (se for novo)</label>
                <input type="password" id="f_senha" placeholder="Padrão: 123456">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Adicionar Acesso</button>
            </div>
        </form>
    </div>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/funcionarios"></script>
</body>
</html>
