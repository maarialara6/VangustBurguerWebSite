<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil — Vangust Burguer Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div id="header-placeholder"></div>

        <div class="page-body">
            <h1 class="page-title">Meu Perfil</h1>
            <p class="page-subtitle">Visualize e gerencie seus dados.</p>

            <div id="mensagemSucesso" class="alert alert-success" style="max-width:460px;margin:0 auto 18px;display:none;">
                Dados atualizados com sucesso.
            </div>

            <div class="perfil-card">

                <!-- MODO VISUALIZAÇÃO -->
                <div id="viewMode">
                    <div class="perfil-banner"></div>
                    <div class="perfil-avatar-wrap">
                        <div class="perfil-avatar-grande" id="viewAvatar"></div>
                    </div>
                    <div class="perfil-nome">
                        <span id="viewNome"></span>
                        <i class="fa-solid fa-circle-check" title="Funcionário verificado"></i>
                    </div>
                    <p class="perfil-email" id="viewEmail"></p>

                    <hr class="perfil-divisor">

                    <div class="perfil-info-list">
                        <div class="perfil-info-row">
                            <span class="label">Cargo:</span>
                            <span class="valor">
                                <i class="fa-solid fa-user-shield" style="color:var(--vg-brown-light);"></i> 
                                <span id="textoCargo">Funcionário</span>
                            </span>
                        </div>
                        <div class="perfil-info-row">
                            <span class="label">E-mail:</span>
                            <span class="valor" id="viewEmailRow"></span>
                        </div>
                        <div class="perfil-info-row">
                            <span class="label">Senha:</span>
                            <span class="valor">•••••••••<i class="fa-solid fa-lock" style="color:var(--vg-text-light);font-size:12px;"></i></span>
                        </div>
                        <div class="perfil-info-row">
                            <span class="label">Status:</span>
                            <span class="valor"><span class="perfil-badge ativo">Ativo</span></span>
                        </div>
                    </div>

                    <div class="perfil-acoes">
                        <button type="button" class="btn btn-primary" onclick="ativarEdicao()">
                            <i class="fa-solid fa-pen"></i> Editar perfil
                        </button>
                    </div>
                </div>

                <!-- MODO EDIÇÃO (Com margem corrigida para o avatar não cortar) -->
                <div id="editMode" style="display:none;padding:24px;">
                    <form id="formPerfil">
                        <div class="perfil-banner" style="margin: -24px -24px 20px -24px; border-radius: 12px 12px 0 0;"></div>
                        <div class="perfil-avatar-wrap" style="margin-top: -65px; margin-bottom: 25px;">
                            <div class="perfil-avatar-grande" id="editAvatar"></div>
                        </div>

                        <div class="form-group">
                            <label>Nome</label>
                            <input type="text" id="f_nome" required>
                        </div>
                        <div class="form-group">
                            <label>E-mail</label>
                            <input type="email" id="f_email" required>
                        </div>
                        <div class="form-group">
                            <label>Nova senha</label>
                            <input type="password" id="f_senha" placeholder="Deixe em branco para manter a atual">
                        </div>

                        <div class="modal-actions" style="margin-top: 20px;">
                            <button type="button" class="btn btn-outline" onclick="cancelarEdicao()">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Salvar alterações</button>
                        </div>
                    </form>
                </div>

            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script>
    VangustAuth.exigirLogin();
    VangustLayout.montar('perfil.html');

    // Definição dinâmica do URL da API para suportar localhost e Locaweb
    const API_BASE = window.location.hostname === 'localhost' 
        ? 'http://localhost/api_hamburgueria/' 
        : window.location.origin + '/api_hamburgueria/';

    function preencherAvatar(elementoId, usuario) {
        const el = document.getElementById(elementoId);
        if (!el) return;
        if (usuario.foto) {
            el.style.backgroundImage = `url('${usuario.foto}')`;
            el.textContent = '';
        } else {
            el.style.backgroundImage = '';
            el.textContent = usuario.nome ? usuario.nome.charAt(0).toUpperCase() : 'A';
        }
    }

    function carregarDados() {
        const usuario = VangustAuth.getUsuarioLogado();
        if (!usuario) return;

        // Modo visualização
        document.getElementById('viewNome').textContent = usuario.nome;
        document.getElementById('viewEmail').textContent = usuario.email;
        document.getElementById('viewEmailRow').textContent = usuario.email;
        
        const cargoAtual = usuario.cargo ? usuario.cargo : 'Funcionário';
        document.getElementById('textoCargo').textContent = cargoAtual;

        preencherAvatar('viewAvatar', usuario);

        // Modo edição
        document.getElementById('f_nome').value = usuario.nome;
        document.getElementById('f_email').value = usuario.email;
        document.getElementById('f_senha').value = '';
        preencherAvatar('editAvatar', usuario);
    }

    function ativarEdicao() {
        document.getElementById('viewMode').style.display = 'none';
        document.getElementById('editMode').style.display = 'block';
    }

    function cancelarEdicao() {
        carregarDados();
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('viewMode').style.display = 'block';
    }

    document.getElementById('formPerfil').addEventListener('submit', async function (e) {
        e.preventDefault();

        const usuarioAtual = VangustAuth.getUsuarioLogado();
        if (!usuarioAtual) {
            alert('Sessão expirada. Faça login novamente.');
            window.location.href = 'index.html';
            return;
        }

        const idUsuario = usuarioAtual.id_usuario || usuarioAtual.id;
        const nome = document.getElementById('f_nome').value.trim();
        const email = document.getElementById('f_email').value.trim();
        const senha = document.getElementById('f_senha').value;

        if (!idUsuario || !nome || !email) {
            alert('Erro: ID, nome e e-mail são obrigatórios.');
            return;
        }

        const formData = new FormData();
        formData.append('id_usuario', idUsuario);
        formData.append('nome', nome);
        formData.append('email', email);
        if (senha) {
            formData.append('senha', senha);
        }

        try {
            const resposta = await fetch(API_BASE + 'atualizar_perfil.php', {
                method: 'POST',
                body: formData
            });

            const resultado = await resposta.json();

            if (resposta.ok && resultado.sucesso) {
                const cargoAtual = resultado.usuario && resultado.usuario.cargo ? resultado.usuario.cargo : (usuarioAtual.cargo || 'Atendente');
                const dadosAtualizados = { ...usuarioAtual, id_usuario: idUsuario, nome, email, cargo: cargoAtual };
                
                sessionStorage.setItem('vangust_admin_dados', JSON.stringify(dadosAtualizados));

                carregarDados();
                document.getElementById('editMode').style.display = 'none';
                document.getElementById('viewMode').style.display = 'block';

                const msg = document.getElementById('mensagemSucesso');
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);

                if (typeof mostrarToast === 'function') {
                    mostrarToast('Perfil atualizado com sucesso.');
                }
                VangustLayout.montar('perfil.html');
            } else {
                alert('Erro ao atualizar: ' + (resultado.erro || resultado.mensagem || 'Erro desconhecido'));
            }
        } catch (erro) {
            alert('Erro de conexão com a API.');
            console.error(erro);
        }
    });

    carregarDados();
</script>
</body>
</html>
