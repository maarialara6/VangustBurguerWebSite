<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Entregadores — Vangust Burguer Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
<div class="app-shell">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
        <div id="header-placeholder"></div>

        <div class="page-body">
            <div class="card-header-row">
                <div>
                    <h1 class="page-title">Entregadores</h1>
                    <p class="page-subtitle">Equipe própria da Vangust Burguer.</p>
                </div>
                <button class="btn btn-primary" onclick="abrirModalNovo()"><i class="fa-solid fa-plus"></i> Novo entregador</button>
            </div>

            <div class="card-box">
                <div class="table-wrap">
                    <table class="vg-table">
                        <thead>
                            <tr><th>Nome</th><th>Telefone</th><th>Veículo</th><th>Em entrega agora</th><th>Status</th><th></th></tr>
                        </thead>
                        <tbody id="tbodyEntregadores"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>
    </div>
</div>

<div class="modal-overlay" id="modalEntregador">
    <div class="modal-box">
        <h3 id="modalTitulo">Novo entregador</h3>
        <form id="formEntregador">
            <input type="hidden" id="f_id">

            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="f_nome" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="f_telefone">
            </div>
            <div class="form-group">
                <label>Veículo</label>
                <input type="text" id="f_veiculo" placeholder="Ex: Moto, Bicicleta, Carro">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/entregadores"></script>
</body>
</html>
